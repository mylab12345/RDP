name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/rdpstudio.spec
      - name: bundle tar.gz
        run: |
          cd dist
          tar czf "KB-Remote-${{ github.ref_name }}-linux-x86_64.tar.gz" KB-Remote
      - uses: actions/upload-artifact@v4
        with:
          name: kb-remote-linux
          path: dist/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[win]" pyinstaller
      - name: Release build (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/rdpstudio.spec
      - name: Verify bundled VC++ runtime
        # The frozen app must start on machines without the system-wide
        # VC++ Redistributable (Windows Server). Fail here, not on users.
        run: |
          # PyInstaller 6 onedir layout keeps every dependency (including the
          # exe-adjacent runtime DLLs) under _internal/.
          $bindir = "dist/KB-Remote/_internal"
          if (-not (Test-Path $bindir)) { $bindir = "dist/KB-Remote" }
          Write-Host "checking $bindir"
          $missing = @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll') | Where-Object { -not (Test-Path "$bindir/$_") }
          if ($missing) { Write-Error "Missing bundled runtime DLLs: $($missing -join ', ')"; exit 1 }
      - name: Smoke test (frozen exe)
        run: dist/KB-Remote/kb-remote.exe --version
      - name: zip portable
        run: Compress-Archive -Path dist/KB-Remote -DestinationPath dist/KB-Remote-${{ github.ref_name }}-windows-x64.zip
      - name: install Inno Setup 6
        run: choco install innosetup --no-progress -y
      - name: build installer (Inno Setup)
        shell: pwsh
        run: |
          $m = (Get-Content src/rdpstudio/__init__.py -Raw | Select-String '__version__ = "([^"]+)"').Matches
          $ver = $m.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" packaging\windows\KB-Remote.iss /Odist
          Get-ChildItem dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: kb-remote-windows
          path: |
            dist/*.zip
            dist/*.exe

  build-appimage:
    name: AppImage (linux-${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libglib2.0-0 libegl1 libgl1 \
                                   xvfb libxkbcommon0 libasound2 libgstreamer1.0-0
          python3 -m pip install -U pip pyinstaller ".[native-terminal]"
      - name: Build AppImage
        run: bash packaging/linux/build-appimage.sh
      - name: Smoke test (xvfb)
        run: |
          cd dist
          chmod +x KB-Remote-*.AppImage
          timeout 20 xvfb-run -a ./KB-Remote-*.AppImage --version || true
      - uses: actions/upload-artifact@v4
        with:
          name: kb-remote-appimage-${{ matrix.arch }}
          path: dist/*.AppImage

  build-flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub/flatpak-github-actions/freedesktop:23.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dist/KB-Remote.flatpak
          manifest-path: flatpak/io.github.mylab12345.KBRemote.yaml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: kb-remote-flatpak
          path: dist/KB-Remote.flatpak

  build-snap:
    name: Snap (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build snap (remote)
        uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: kb-remote-snap
          path: ${{ steps.build.outputs.snap }}

  release:
    needs: [build-linux, build-windows, build-appimage, build-flatpak, build-snap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
