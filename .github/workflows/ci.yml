name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (ubuntu-latest, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install sshd
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

  build:
    name: pyinstaller (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/rdpstudio.spec
      - uses: actions/upload-artifact@v4
        with:
          name: KB-Remote-Linux
          path: dist/KB-Remote/
