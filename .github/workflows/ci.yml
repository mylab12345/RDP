name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (ubuntu-latest, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install sshd
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

  windows-smoke:
    # Cross-platform gate (TEST-01): import-level + headless smoke on Windows.
    # The full GUI suite is validated on Linux; here we catch Windows-only
    # breakage (path handling, ConPTY imports, win32 branches) early. Core
    # tests must pass; GUI tests are best-effort (continue-on-error) until the
    # offscreen backend is proven stable on Windows runners.
    name: windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev,win]"
      - name: Import + CLI smoke
        run: |
          python -c "import rdpstudio; print(rdpstudio.__version__)"
          python -m rdpstudio --version
          python -c "from rdpstudio.app import parse_cli; assert parse_cli(['-v','x'])[0] == 1"
      - name: Core (platform-independent) tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_models_store.py tests/test_state_validation.py tests/test_store_import_safety.py tests/test_crypto.py tests/test_vault.py tests/test_session_check.py tests/test_rdp_client.py tests/test_rdpfile.py tests/test_core_persistence.py tests/test_retry_transfers.py tests/test_transfer_engine.py tests/test_production_readiness.py --timeout=180

  build:
    name: pyinstaller (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/rdpstudio.spec
      - uses: actions/upload-artifact@v4
        with:
          name: KB-Remote-Linux
          path: dist/KB-Remote/
