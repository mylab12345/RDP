name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - run: pip install . pyinstaller ".[win]"
      - run: pyinstaller packaging\windows\rdpstudio-windows.spec
      - name: Update version in Inno script
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $ver = $ver.TrimStart('v')
          (gc packaging\windows\kb-remote-setup.iss -Raw) -replace '#define AppVersion ".*"', "#define AppVersion `"`$ver`"" | sc packaging\windows\kb-remote-setup.iss -Encoding UTF8
      - name: Build Inno Setup installer
        run: iscc packaging\windows\kb-remote-setup.iss
      - name: bundle zip (portable)
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path KB-Remote -DestinationPath "KB-Remote-${{ github.ref_name }}-windows-x64.zip"
      - name: stage universal release assets
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item "installer\KB-Remote-Setup-$ver-windows-x64.exe" "dist\KB-Remote-Setup-$ver-windows-x64.exe"
          # Stable names so the universal link always resolves:
          #   .../releases/latest/download/KB-Remote-Setup.exe
          #   .../releases/latest/download/install.ps1
          #   .../releases/latest/download/install.cmd
          Copy-Item "installer\KB-Remote-Setup-$ver-windows-x64.exe" "dist\KB-Remote-Setup.exe"
          Copy-Item "install.ps1" "dist\install.ps1"
          Copy-Item "packaging\windows\install.cmd" "dist\install.cmd"
      - uses: actions/upload-artifact@v4
        with:
          name: kb-remote-windows
          path: |
            dist/*.zip
            dist/KB-Remote-Setup*.exe
            dist/install.ps1
            dist/install.cmd

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/rdpstudio.spec
      - name: bundle tar.gz
        run: |
          cd dist
          tar czf "KB-Remote-${{ github.ref_name }}-linux-x86_64.tar.gz" KB-Remote
      - uses: actions/upload-artifact@v4
        with:
          name: kb-remote-linux
          path: dist/*.tar.gz

  build-appimage:
    name: AppImage (linux-${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libglib2.0-0 libegl1 libgl1 \
                                   xvfb libxkbcommon0 libasound2 libgstreamer1.0-0
          python3 -m pip install -U pip pyinstaller ".[native-terminal]"
      - name: Build AppImage
        run: bash packaging/linux/build-appimage.sh
      - name: Smoke test (xvfb)
        run: |
          cd dist
          chmod +x KB-Remote-*.AppImage
          timeout 20 xvfb-run -a ./KB-Remote-*.AppImage --version || true
      - uses: actions/upload-artifact@v4
        with:
          name: kb-remote-appimage-${{ matrix.arch }}
          path: dist/*.AppImage

  build-flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub/flatpak-github-actions/freedesktop:23.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dist/KB-Remote.flatpak
          manifest-path: packaging/flatpak/io.github.mylab12345.KBRemote.yaml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: kb-remote-flatpak
          path: dist/KB-Remote.flatpak

  build-snap:
    name: Snap (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build snap (remote)
        uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: kb-remote-snap
          path: ${{ steps.build.outputs.snap }}

  release:
    needs: [build-windows, build-linux, build-appimage, build-flatpak, build-snap]
    # Publish whatever built successfully: a Flatpak/Snap hiccup must never
    # block the universal Windows installer link from going live.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
