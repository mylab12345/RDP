name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/rdpstudio.spec
      - name: bundle tar.gz
        run: |
          cd dist
          tar czf "KB-Remote-${{ github.ref_name }}-linux-x86_64.tar.gz" KB-Remote
      - uses: actions/upload-artifact@v4
        with:
          name: kb-remote-linux
          path: dist/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/rdpstudio.spec
      - name: zip portable
        run: Compress-Archive -Path dist/KB-Remote -DestinationPath dist/KB-Remote-${{ github.ref_name }}-windows-x64.zip
      - name: build installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action-CN@v1.2.5
        with:
          path: packaging/windows/KB-Remote.iss
          options: /O dist
      - uses: actions/upload-artifact@v4
        with:
          name: kb-remote-windows
          path: |
            dist/*.zip
            dist/*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
