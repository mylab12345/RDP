[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdp-studio"
version = "0.9.0"
description = "KB-Remote cross-platform remote-access workbench: SSH/SFTP/OpenSSH for Linux, Windows, BSD and macOS hosts; RDP for Windows hosts. Tabbed sessions, tunnels, credential vault, file transfer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KB-Remote contributors" }]
keywords = ["ssh", "sftp", "rdp", "remote-desktop", "terminal", "tunnel", "port-forwarding", "mobaxterm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
  "Topic :: Terminals",
]
dependencies = [
  # Floors chosen to exclude versions with known CVEs:
  #  - paramiko  >= 3.4.0 : CVE-2023-48795 (Terrapin SSH prefix truncation)
  #  - cryptography >= 44.0.1 : CVE-2024-12797 (OpenSSL RFC7250 handshake)
  "PySide6-Essentials>=6.6",
  "paramiko>=3.4.1",
  "pyte>=0.8.2",
  "cryptography>=44.0.1",
]

[project.optional-dependencies]
# Windows niceties: ConPTY-backed local shell (optional, graceful fallback)
win = [
  "pywinpty>=2.2; platform_system=='Windows'",
]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/mylab12345/RDP"
Documentation = "https://github.com/mylab12345/RDP/tree/main/docs"

[project.scripts]
kb-remote = "rdpstudio.app:main"
rdpstudio = "rdpstudio.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdpstudio = ["resources/*.qss", "resources/icons/*.svg", "resources/icons/*.png", "resources/*.License"]


[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 120

[tool.ruff.lint.per-file-ignores]
# Qt idioms (long signal signatures, star imports kept narrow)
"src/rdpstudio/ui/*" = ["E402"]
