[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdp-studio"
version = "0.9.1"
description = "KB-Remote cross-platform remote-access workbench: SSH/SFTP/OpenSSH for Linux, Windows, BSD and macOS hosts; RDP for Windows hosts. Tabbed sessions, tunnels, credential vault, file transfer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KB-Remote contributors" }]
keywords = ["ssh", "sftp", "rdp", "remote-desktop", "terminal", "tunnel", "port-forwarding", "mobaxterm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
  "Topic :: Terminals",
]
dependencies = [
  # Floors exclude every advisory known at the 2026-10 hardening pass:
  #  - paramiko >= 5.0.0 : GHSA-r374-rxx8-8654 / CVE-2026-44405 (SHA-1 RSA
  #    signatures accepted; fixed after 4.0.0). The 5.x line also carries
  #    the Terrapin fix (CVE-2023-48795) and OpenSSH-sized flow control.
  #  - cryptography >= 50.0.0 : GHSA-g6cj-pr64-35w5 (PKCS#7 Bleichenbacher),
  #    GHSA-jwv3-5hgf-82ww, GHSA-m2h6-j472-rp4c, GHSA-537c-gmf6-5ccf
  #    (bundled OpenSSL) and GHSA-r6ph-v2qm-q3c2 all affect older releases.
  #  - PySide6-Essentials>=6.6, pyte>=0.8.2 : no open pip advisories.
  "PySide6-Essentials>=6.6",
  "paramiko>=5.0.0",
  "pyte>=0.8.2",
  "cryptography>=50.0.0",
]

[project.optional-dependencies]
# Windows niceties: ConPTY-backed local shell (optional, graceful fallback)
win = [
  "pywinpty>=2.2; platform_system=='Windows'",
]
# Native Linux terminal renderer, analogous to SSH Pilot's VTE path. The
# package is optional so the MIT core remains usable on Python 3.10, Windows,
# macOS, headless CI, and minimal Linux installations. It supplies the
# QTermWidget/Konsole-style compiled VT emulator; the app falls back to pyte
# automatically when the wheel or its Qt ABI is unavailable.
native-terminal = [
  "pyside6-qtermwidget>=0.5.6.11.1; platform_system=='Linux' and python_version >= '3.11'",
]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/mylab12345/RDP"
Documentation = "https://github.com/mylab12345/RDP/tree/main/docs"

[project.scripts]
kb-remote = "rdpstudio.app:main"
rdpstudio = "rdpstudio.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdpstudio = ["resources/*.qss", "resources/icons/*.svg", "resources/icons/*.png", "resources/*.License"]


[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 120
markers = [
  "unit: fast tests isolated from external services",
  "integration: tests crossing component or process boundaries",
  "gui: tests requiring a Qt application/display backend",
  "regression: tests pinning a previously identified failure mode",
]

[tool.ruff.lint.per-file-ignores]
# Qt idioms (long signal signatures, star imports kept narrow)
"src/rdpstudio/ui/*" = ["E402"]
