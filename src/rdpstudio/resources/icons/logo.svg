<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="18%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#163024"/>
      <stop offset="55%" stop-color="#0c1418"/>
      <stop offset="100%" stop-color="#1a1020"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ee0b8"/>
      <stop offset="50%" stop-color="#6fbf78"/>
      <stop offset="100%" stop-color="#e07a4a"/>
    </linearGradient>
    <linearGradient id="key" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0d08a"/>
      <stop offset="100%" stop-color="#fff4c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#5ee0b855"/>
      <stop offset="55%" stop-color="#5ee0b800"/>
      <stop offset="100%" stop-color="#00000000"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#tile)"/>
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#glow)"/>
  <rect x="20" y="20" width="216" height="216" rx="52" fill="none" stroke="url(#ring)" stroke-width="5"/>

  <!-- remote window -->
  <rect x="58" y="68" width="140" height="96" rx="18" fill="#081018" stroke="#5ee0b8" stroke-width="5"/>
  <circle cx="78" cy="88" r="5" fill="#e07a4a"/>
  <circle cx="94" cy="88" r="5" fill="#f0d08a"/>
  <circle cx="110" cy="88" r="5" fill="#6fbf78"/>

  <!-- prompt + connection beam -->
  <path d="M78 126 L98 142 L78 158" fill="none" stroke="#5ee0b8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M114 150 H168" fill="none" stroke="#f0d08a" stroke-width="8" stroke-linecap="round"/>

  <!-- key: remote access -->
  <g filter="url(#soft)" transform="translate(148 148)">
    <circle cx="28" cy="28" r="22" fill="none" stroke="url(#key)" stroke-width="8"/>
    <circle cx="28" cy="28" r="7" fill="#0c1418"/>
    <path d="M46 36 L78 68" stroke="url(#key)" stroke-width="8" stroke-linecap="round"/>
    <path d="M68 58 L80 70" stroke="url(#key)" stroke-width="7" stroke-linecap="round"/>
    <path d="M60 66 L72 78" stroke="url(#key)" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
